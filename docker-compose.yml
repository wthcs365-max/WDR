# ============================================================================
# WTH Drive Rentals — Full-Stack Deployment
# ============================================================================

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: wdr_dev
      POSTGRES_USER: wdr
      POSTGRES_PASSWORD: wdr_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wdr -d wdr_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # WDR Microservices (Ports 4001–4010)
  # ---------------------------------------------------------------------------
  iam-service:
    build:
      context: .
      dockerfile: services/iam-service/Dockerfile
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://wdr:wdr_dev_password@postgres:5432/wdr_dev
      JWT_SECRET: wdr-dev-secret-do-not-use-in-production
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  fleet-service:
    build:
      context: .
      dockerfile: services/fleet-service/Dockerfile
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      DATABASE_URL: postgresql://wdr:wdr_dev_password@postgres:5432/wdr_dev
      JWT_SECRET: wdr-dev-secret-do-not-use-in-production
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    ports:
      - "4003:4003"
    environment:
      PORT: 4003
      DATABASE_URL: postgresql://wdr:wdr_dev_password@postgres:5432/wdr_dev
      JWT_SECRET: wdr-dev-secret-do-not-use-in-production
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fleet-service:
        condition: service_started
    restart: unless-stopped

  ledger-service:
    build:
      context: .
      dockerfile: services/ledger-service/Dockerfile
    ports:
      - "4004:4004"
    environment:
      PORT: 4004
      DATABASE_URL: postgresql://wdr:wdr_dev_password@postgres:5432/wdr_dev
      JWT_SECRET: wdr-dev-secret-do-not-use-in-production
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      booking-service:
        condition: service_started
    restart: unless-stopped

  trust-service:
    build:
      context: .
      dockerfile: services/trust-service/Dockerfile
    ports:
      - "4005:4005"
    environment:
      PORT: 4005
      DATABASE_URL: postgresql://wdr:wdr_dev_password@postgres:5432/wdr_dev
      JWT_SECRET: wdr-dev-secret-do-not-use-in-production
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  telemetry-service:
    build:
      context: .
      dockerfile: services/telemetry-service/Dockerfile
    ports:
      - "4006:4006"
    environment:
      PORT: 4006
      DATABASE_URL: postgresql://wdr:wdr_dev_password@postgres:5432/wdr_dev
      JWT_SECRET: wdr-dev-secret-do-not-use-in-production
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  subscription-service:
    build:
      context: .
      dockerfile: services/subscription-service/Dockerfile
    ports:
      - "4007:4007"
    environment:
      PORT: 4007
      DATABASE_URL: postgresql://wdr:wdr_dev_password@postgres:5432/wdr_dev
      JWT_SECRET: wdr-dev-secret-do-not-use-in-production
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ledger-service:
        condition: service_started
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "4008:4008"
    environment:
      PORT: 4008
      DATABASE_URL: postgresql://wdr:wdr_dev_password@postgres:5432/wdr_dev
      JWT_SECRET: wdr-dev-secret-do-not-use-in-production
      CORS_ORIGIN: "*"
      DEFAULT_NOTIFICATION_PROVIDER: mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    ports:
      - "4009:4009"
    environment:
      PORT: 4009
      DATABASE_URL: postgresql://wdr:wdr_dev_password@postgres:5432/wdr_dev
      JWT_SECRET: wdr-dev-secret-do-not-use-in-production
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  partner-service:
    build:
      context: .
      dockerfile: services/partner-service/Dockerfile
    ports:
      - "4010:4010"
    environment:
      PORT: 4010
      DATABASE_URL: postgresql://wdr:wdr_dev_password@postgres:5432/wdr_dev
      JWT_SECRET: wdr-dev-secret-do-not-use-in-production
      CORS_ORIGIN: "*"
      TBYB_LEAD_EXPIRY_DAYS: 30
      TBYB_HOT_LEAD_THRESHOLD: 70
      TBYB_SUCCESS_FEE_ZAR: 1500
      TBYB_CONVERSION_PCT: 0.02
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fleet-service:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # API Gateway (Apollo Federation)
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "4050:4050"
    environment:
      PORT: 4050
      AUTH_SERVICE_URL: http://iam-service:4001/graphql
      IAM_SERVICE_URL: http://iam-service:4001/graphql
      FLEET_SERVICE_URL: http://fleet-service:4002/graphql
      BOOKING_SERVICE_URL: http://booking-service:4003/graphql
      LEDGER_SERVICE_URL: http://ledger-service:4004/graphql
      TRUST_SERVICE_URL: http://trust-service:4005/graphql
      TELEMETRY_SERVICE_URL: http://telemetry-service:4006/graphql
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:4007/graphql
    depends_on:
      - iam-service
      - fleet-service
      - booking-service
      - ledger-service
      - trust-service
      - telemetry-service
      - subscription-service
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Kong API Gateway (Edge Proxy)
  # ---------------------------------------------------------------------------
  kong:
    image: kong:3.5
    volumes:
      - ./kong/config/kong.yml:/usr/local/kong/declarative/kong.yml
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    depends_on:
      - api-gateway
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Mobile App (Vite / React frontend — port 3000)
  # ---------------------------------------------------------------------------
  mobile-app:
    build:
      context: .
      dockerfile: services/mobile-app/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - kong
    restart: unless-stopped

volumes:
  pgdata: