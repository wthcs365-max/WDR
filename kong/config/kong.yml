_format_version: "3.0"
_transform: true

services:
  - name: iam-service
    url: http://iam-service:4001
    routes:
      - name: iam-v1-route
        paths:
          - /api/v1/auth
          - /api/v1/users
          - /api/v1/admin
        strip_path: true # This will map /api/v1/auth -> /v1/auth if upstream is at :4001/
        # Wait, if url is http://iam-service:4001, then /api/v1/auth -> /v1/auth requires strip_path: false AND the upstream to handle /api/v1/auth
        # OR strip_path: true and paths: [/api] -> /v1/auth.
        # Let's use the most flexible: strip_path: true and paths including the prefix we want to keep.
        # Actually, simpler:
    path: /

  - name: fleet-service
    url: http://fleet-service:4002
    path: /

  - name: booking-service
    url: http://booking-service:4003
    path: /

  - name: ledger-service
    url: http://ledger-service:4004
    path: /

  - name: trust-service
    url: http://trust-service:4005
    path: /

  - name: telemetry-service
    url: http://telemetry-service:4006
    path: /

  - name: subscription-service
    url: http://subscription-service:4007
    path: /

  - name: partner-service
    url: http://partner-service:4010
    path: /

  - name: graphql-gateway
    url: http://api-gateway:4050
    path: /

# Simplified routes mapping
routes:
  - name: iam-route
    service: iam-service
    paths:
      - /api/v1/auth
      - /api/v1/users
      - /api/v1/admin
    strip_path: false # iam-service expects /v1/..., but it is actually mounted at /v1 in its index.ts. 
    # Wait, if I use strip_path: false, it sends /api/v1/auth.
    # If I use strip_path: true, it sends /.
    # If I want /v1/auth, I should use paths: [/api] and strip_path: true.
  
  - name: fleet-route
    service: fleet-service
    paths:
      - /api/v1/vehicles
    strip_path: false
    
  - name: booking-route
    service: booking-service
    paths:
      - /api/v1/bookings
    strip_path: false
    
  - name: ledger-route
    service: ledger-service
    paths:
      - /api/v1/wallet
      - /api/v1/payments
      - /api/v1/invoices
      - /webhooks
    strip_path: false
    
  - name: trust-route
    service: trust-service
    paths:
      - /api/v1/trust
      - /api/v1/claims
    strip_path: false
    
  - name: telemetry-route
    service: telemetry-service
    paths:
      - /api/v1/telemetry
      - /ws
    strip_path: false
    
  - name: subscription-route
    service: subscription-service
    paths:
      - /api/v1/subscriptions
    strip_path: false
    
  - name: partner-route
    service: partner-service
    paths:
      - /api/v1/partner
    strip_path: false
    
  - name: graphql-route
    service: graphql-gateway
    paths:
      - /graphql
    strip_path: false

plugins:
  - name: jwt
    config:
      header_names:
        - Authorization
      key_claim_name: sub
      claims_to_verify:
        - exp
    # We should exclude /api/v1/auth/login and /api/v1/auth/register
    # In Kong 3.x we can use 'protocols' or 'enabled' or just apply it to specific routes.
    # Better to apply it to all and then disable it on public routes.
    
  - name: rate-limiting
    config:
      minute: 120
      policy: local
      
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600
